<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="Open source retrieval augmented generation you can host yourself on the Cloudflare free plan. Upload documents, ask questions, get answers with citations."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#17171c" />
    <meta property="og:title" content="RAG in the Box" />
    <meta
      property="og:description"
      content="Open source retrieval augmented generation you can host yourself on the Cloudflare free plan."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RAG in the Box" />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <!-- Without an image a shared link renders as a bare line of text, and the
         thing this is actually about, an answer beside the sentence it came
         from, stays invisible until somebody clicks.

         The address is substituted at build time. An absolute URL is required
         here, and hardcoding the final domain means every share before the DNS
         record exists fetches an image from a host that is not answering yet. -->
    <meta property="og:image" content="%VITE_SITE_URL%/og.png" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta
      property="og:image:alt"
      content="A document passage on the left, highlighted, and on the right an answer citing it."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RAG in the Box" />
    <meta
      name="twitter:description"
      content="Ask your documents a question and get answers that show their working."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og.png" />
    <title>RAG in the Box</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
