# RAG in the Box: Worker configuration.
#
# The top-level settings are the local development defaults, so `npm run dev`
# works with no Cloudflare account at all. The named environments below are what
# gets deployed. Wrangler does not inherit vars into a named environment, so each
# one repeats every value it needs.
#
# scripts/deploy.sh fills in database_id from your .env file. Do not commit real
# ids or secrets to this file.

name = "rag-in-the-box"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "rag-db"
database_id = "local"
migrations_dir = "drizzle"

# Local development runs entirely offline: vectors live in D1 and the AI
# providers are replaced with deterministic stand-ins. See docs/architecture.md.
#
# The two secrets below are development values on purpose, so a fresh clone runs
# with no setup at all. They are visible to anyone with this repository and are
# worthless. Real deployments get real secrets through `wrangler secret put`,
# which scripts/deploy.sh does for you, and those never appear in any file here.
[vars]
BETTER_AUTH_SECRET = "development-only-secret-not-used-in-any-deployment"
ADMIN_TOKEN = "development-only-admin-token"
APP_MODE = "self-host"
APP_VERSION = "1.0.0"
ALLOWED_ORIGIN = "http://localhost:5173"
BETTER_AUTH_URL = "http://localhost:8787"
VECTOR_BACKEND = "d1"
VECTOR_DIMENSIONS = "384"
OFFLINE_AI = "true"
DEFAULT_TIER = "free"
PASSWORD_KDF_ITERATIONS = "100000"

# ---------------------------------------------------------------------------
# Self-hosted production
# ---------------------------------------------------------------------------
[env.production]
name = "rag-in-the-box"

[env.production.ai]
binding = "AI"

[[env.production.d1_databases]]
binding = "DB"
database_name = "rag-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "drizzle"

[[env.production.vectorize]]
binding = "VECTORIZE"
index_name = "rag-index"

[env.production.observability]
enabled = true

[env.production.vars]
APP_MODE = "self-host"
APP_VERSION = "1.0.0"
ALLOWED_ORIGIN = "https://REPLACE_WITH_WEB_ORIGIN"
BETTER_AUTH_URL = "https://REPLACE_WITH_API_ORIGIN"
VECTOR_BACKEND = "vectorize"
VECTOR_DIMENSIONS = "384"
DEFAULT_TIER = "free"
PASSWORD_KDF_ITERATIONS = "100000"

# ---------------------------------------------------------------------------
# Public demo
#
# No accounts, one curated workspace, and hard daily caps so the deployment
# stays inside every free allowance it depends on.
# ---------------------------------------------------------------------------
[env.demo]
name = "rag-in-the-box-demo"

[env.demo.ai]
binding = "AI"

[[env.demo.d1_databases]]
binding = "DB"
database_name = "rag-demo-db"
database_id = "REPLACE_WITH_DEMO_D1_DATABASE_ID"
migrations_dir = "drizzle"

[[env.demo.vectorize]]
binding = "VECTORIZE"
index_name = "rag-demo-index"

[env.demo.observability]
enabled = true

[env.demo.vars]
APP_MODE = "demo"
APP_VERSION = "1.0.0"
ALLOWED_ORIGIN = "https://rib.mwhassan.com"
BETTER_AUTH_URL = "https://rib-api.mwhassan.com"
VECTOR_BACKEND = "vectorize"
VECTOR_DIMENSIONS = "384"
DEFAULT_TIER = "free"
DEMO_TENANT_ID = "demo-curated"
DEMO_VISITOR_CHATS_PER_DAY = "12"
DEMO_VISITOR_UPLOADS_PER_DAY = "1"
DEMO_GLOBAL_CHATS_PER_DAY = "110"
DEMO_GLOBAL_UPLOADS_PER_DAY = "30"
DEMO_UPLOADS_ENABLED = "true"
# Two megabytes is a few pages, which is all it takes to watch the pipeline run.
DEMO_MAX_UPLOAD_BYTES = "2097152"
# Uploads are deleted after this long. Long enough to try the thing and export
# it, short enough that Vectorize storage, which does not reset daily, stays
# inside the free index.
DEMO_RETENTION_HOURS = "3"

# Runs the purge above. Hourly, at a minute nobody else picks, so a backlog
# never builds up between runs.
[env.demo.triggers]
crons = ["17 * * * *"]
